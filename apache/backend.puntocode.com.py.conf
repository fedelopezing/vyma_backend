# Configuración de VirtualHost en Apache2 para backend.puntocode.com.py
# Redirecciona el tráfico del subdominio al backend Node.js / NestJS en el puerto 3000

<VirtualHost *:80>
    ServerName backend.puntocode.com.py

    # Directorio raíz física en el servidor donde se aloja el proyecto
    DocumentRoot /var/www/nodejs/vyma_backend

    <Directory /var/www/nodejs/vyma_backend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Excepción para validación de Certbot/Let's Encrypt sin pasar por el proxy
    ProxyPass /.well-known/ !

    # Activar motor de reescritura para soporte de WebSockets (NestJS / SSE)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:3000/$1 [P,L]

    # Preservar Host original y desactivar Forward Proxy abierto
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 86400

    # Cabecera indicando el protocolo
    RequestHeader set X-Forwarded-Proto "http"

    # Redirección de peticiones al puerto local 3000
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

     # Archivos de logs separados para identificar fallas fácilmente en testing
    ErrorLog /var/www/nodejs/vyma_backend/logs/error.log
    CustomLog /var/www/nodejs/vyma_backend/logs/access.log combined
</VirtualHost>
